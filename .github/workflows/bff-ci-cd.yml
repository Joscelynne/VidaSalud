name: BFF CI/CD

on:
  pull_request:
    paths:
      - "ms-vidasalud-bff/**"
      - "scripts/deploy-bff-ec2-runner.sh"
      - ".github/workflows/bff-ci-cd.yml"
  push:
    branches:
      - main
    # The workflow's initial merge must not deploy. Backend changes trigger it.
    paths:
      - "ms-vidasalud-bff/**"
      - "!ms-vidasalud-bff/.dockerignore"

permissions:
  contents: read

concurrency:
  group: vidasalud-bff-production
  cancel-in-progress: false

jobs:
  test:
    name: Test BFF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ms-vidasalud-bff/pom.xml
      - name: Run unit and security tests
        run: mvn -B -f ms-vidasalud-bff/pom.xml test '-Dtest=!*IntegrationTest'

  deploy:
    name: Build and deploy BFF on EC2 runner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    timeout-minutes: 20
    runs-on: [self-hosted, linux, x64, vidasalud-ec2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and deploy on this EC2 instance
        run: bash scripts/deploy-bff-ec2-runner.sh
