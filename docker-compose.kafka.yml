# ==============================================================================
# INFRAESTRUCTURA APACHE KAFKA (EP5 / EP6) — VIDASALUD
# ==============================================================================
# Arquitectura distribuida con tolerancia a fallos y alta disponibilidad:
# - Ensamble ZooKeeper de 3 nodos (Quórum 2f+1: soporta caída de 1 nodo ZK)
# - Clúster Apache Kafka de 3 brokers (Soporta factor de réplica 3 y particiones 3)
# - Consola Web Kafka UI (Monitoreo de brokers, tópicos, mensajes, consumer groups, lag)
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # ZOOKEEPER NODO 1 (ID: 1)
  # ----------------------------------------------------------------------------
  zookeeper1:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vidasalud-zk-1
    hostname: zookeeper1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"
      KAFKA_OPTS: "-Xmx128m -Xms128m"
    volumes:
      - zk1_data:/var/lib/zookeeper/data
      - zk1_log:/var/lib/zookeeper/log
    networks:
      - vidasalud-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # ZOOKEEPER NODO 2 (ID: 2)
  # ----------------------------------------------------------------------------
  zookeeper2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vidasalud-zk-2
    hostname: zookeeper2
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"
      KAFKA_OPTS: "-Xmx128m -Xms128m"
    volumes:
      - zk2_data:/var/lib/zookeeper/data
      - zk2_log:/var/lib/zookeeper/log
    networks:
      - vidasalud-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # ZOOKEEPER NODO 3 (ID: 3)
  # ----------------------------------------------------------------------------
  zookeeper3:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vidasalud-zk-3
    hostname: zookeeper3
    ports:
      - "2183:2181"
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"
      KAFKA_OPTS: "-Xmx128m -Xms128m"
    volumes:
      - zk3_data:/var/lib/zookeeper/data
      - zk3_log:/var/lib/zookeeper/log
    networks:
      - vidasalud-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # KAFKA BROKER 1 (ID: 1)
  # ----------------------------------------------------------------------------
  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vidasalud-kafka-1
    hostname: kafka1
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://172.31.67.180:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks:
      - vidasalud-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # KAFKA BROKER 2 (ID: 2)
  # ----------------------------------------------------------------------------
  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vidasalud-kafka-2
    hostname: kafka2
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9093,EXTERNAL://172.31.67.180:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks:
      - vidasalud-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # KAFKA BROKER 3 (ID: 3)
  # ----------------------------------------------------------------------------
  kafka3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vidasalud-kafka-3
    hostname: kafka3
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9094,EXTERNAL://172.31.67.180:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka3_data:/var/lib/kafka/data
    networks:
      - vidasalud-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # KAFKA UI (Panel Web de Gestión en http://localhost:8090)
  # ----------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vidasalud-kafka-ui
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "VidaSalud-Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:9092,kafka2:9093,kafka3:9094"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
    networks:
      - vidasalud-net
    restart: unless-stopped

# ==============================================================================
# RED COMPARTIDA Y VOLÚMENES PERSISTENTES
# ==============================================================================
networks:
  vidasalud-net:
    name: vidasalud-net

volumes:
  zk1_data:
  zk1_log:
  zk2_data:
  zk2_log:
  zk3_data:
  zk3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
