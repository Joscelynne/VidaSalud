# ==============================================================================
# INFRAESTRUCTURA DE CLUSTER RABBITMQ PARA EP4 (2 NODOS) — VIDASALUD
# ==============================================================================
# Este archivo despliega el cluster RabbitMQ de 2 nodos con descubrimiento
# clásico mediante rabbitmq.conf y optimización de memoria para entornos micro.
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # NODO 1: NODO PRINCIPAL / SEMILLA (rabbitmq1)
  # ----------------------------------------------------------------------------
  rabbitmq1:
    image: rabbitmq:3.13-management-alpine
    container_name: vidasalud-rabbitmq-node1
    hostname: rabbitmq1
    mem_limit: 220m
    ports:
      - "5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: "VIDASALUD_ERLANG_COOKIE_EP4_SECRET_2026"
      RABBITMQ_NODENAME: "rabbit@rabbitmq1"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-${RABBITMQ_USERNAME:-vidasalud}}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-${RABBITMQ_PASSWORD:-vidasalud_local_2026}}"
      RABBITMQ_DEFAULT_VHOST: "/"
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      vidasalud_default:
        aliases:
          - rabbitmq
          - rabbitmq1
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # NODO 2: NODO SECUNDARIO (rabbitmq2) CON DESCUBRIMIENTO CLÁSICO DE PEERS
  # ----------------------------------------------------------------------------
  rabbitmq2:
    image: rabbitmq:3.13-management-alpine
    container_name: vidasalud-rabbitmq-node2
    hostname: rabbitmq2
    mem_limit: 220m
    ports:
      - "5673:5672"
      - "127.0.0.1:15673:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: "VIDASALUD_ERLANG_COOKIE_EP4_SECRET_2026"
      RABBITMQ_NODENAME: "rabbit@rabbitmq2"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-${RABBITMQ_USERNAME:-vidasalud}}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-${RABBITMQ_PASSWORD:-vidasalud_local_2026}}"
      RABBITMQ_DEFAULT_VHOST: "/"
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      vidasalud_default:
        aliases:
          - rabbitmq2
    depends_on:
      rabbitmq1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

# ------------------------------------------------------------------------------
# REDES Y VOLÚMENES PERSISTENTES PARA EL CLUSTER
# ------------------------------------------------------------------------------
networks:
  vidasalud_default:
    external: true

volumes:
  rabbitmq1_data:
  rabbitmq2_data:
