version: '3.8'

services:
  # Servicio Frontend: React 19 + MSAL (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vidasalud-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_AZURE_CLIENT_ID=${VITE_AZURE_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      - VITE_AZURE_TENANT_ID=${VITE_AZURE_TENANT_ID:-common}
      - VITE_API_SCOPE=${VITE_API_SCOPE:-api://00000000-0000-0000-0000-000000000000/access_as_user}
      - VITE_API_GATEWAY_URL=${VITE_API_GATEWAY_URL:-http://localhost:8080}
    networks:
      - vidasalud-net
    depends_on:
      - bff
    restart: unless-stopped

  # Servicio Backend BFF: Spring Boot 3.5.x (Java 21)
  bff:
    build:
      context: ./ms-vidasalud-bff
      dockerfile: Dockerfile
    container_name: vidasalud-bff
    ports:
      - "8080:8080"
    environment:
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-common}
      - AZURE_API_CLIENT_ID=${AZURE_API_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SERVER_PORT=8080
    networks:
      - vidasalud-net
    restart: unless-stopped

networks:
  vidasalud-net:
    driver: bridge
