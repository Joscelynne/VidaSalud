services:
  # ==========================================
  # FRONTEND: React 19 + MSAL + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vidasalud-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_AZURE_CLIENT_ID=${VITE_AZURE_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      - VITE_AZURE_TENANT_ID=${VITE_AZURE_TENANT_ID:-common}
      - VITE_API_SCOPE=${VITE_API_SCOPE:-api://00000000-0000-0000-0000-000000000000/access_as_user}
      - VITE_API_GATEWAY_URL=${VITE_API_GATEWAY_URL:-http://localhost:8080}
    networks:
      - vidasalud-net
    depends_on:
      - bff
    restart: unless-stopped

  # ==========================================
  # BACKEND: Spring Boot BFF + RabbitMQ
  # ==========================================
  bff:
    build:
      context: ./ms-vidasalud-bff
      dockerfile: Dockerfile
    container_name: vidasalud-bff
    ports:
      - "8080:8080"
    environment:
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-common}
      - AZURE_API_CLIENT_ID=${AZURE_API_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SERVER_PORT=8080

      # Conexión a RabbitMQ
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-vidasalud}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Debes definir RABBITMQ_PASSWORD}
      - SPRING_RABBITMQ_VIRTUAL_HOST=/

    networks:
      - vidasalud-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # RABBITMQ: Broker de mensajería
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: vidasalud-rabbitmq
    hostname: rabbitmq

    ports:
      # Comunicación AMQP
      - "5672:5672"

      # Panel web disponible solo desde el Mac local
      - "127.0.0.1:15672:15672"

    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-vidasalud}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?Debes definir RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=/

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - vidasalud-net

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

# ==========================================
# REDES
# ==========================================
networks:
  vidasalud-net:
    driver: bridge

# ==========================================
# VOLÚMENES PERSISTENTES
# ==========================================
volumes:
  rabbitmq_data:
