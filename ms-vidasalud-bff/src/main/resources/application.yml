server:
  port: ${SERVER_PORT:8080}

error:
  include-message: always
  include-binding-errors: always

spring:
  application:
    name: ms-vidasalud-bff

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # PostgreSQL Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vidasalud}
    username: ${DB_USERNAME:vidasalud_admin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  # JPA / Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/v2.0
          audiences:
            - api://${AZURE_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}
            - ${AZURE_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}

azure:
  tenant-id: ${AZURE_TENANT_ID:common}
  api-client-id: ${AZURE_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    cl.duoc.vidasalud.bff: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG