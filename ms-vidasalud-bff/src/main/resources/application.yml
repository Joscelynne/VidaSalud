server:
  port: ${SERVER_PORT:8080}

error:
  include-message: always
  include-binding-errors: always

spring:
  application:
    name: ms-vidasalud-bff

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vidasalud}
    username: ${SPRING_DATASOURCE_USERNAME:vidasalud}
    password: ${SPRING_DATASOURCE_PASSWORD:vidasalud_local_2026}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:0}
    validate-on-migrate: true
    locations: classpath:db/migration

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
      data-locations: classpath:dev-data.sql

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:}
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:vidasalud}
    password: ${SPRING_RABBITMQ_PASSWORD:vidasalud_local_2026}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${SPRING_RABBITMQ_LISTENER_PREFETCH:10}
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: ${SPRING_RABBITMQ_RETRY_INITIAL_INTERVAL:1000ms}
          multiplier: ${SPRING_RABBITMQ_RETRY_MULTIPLIER:2.0}
          max-attempts: ${SPRING_RABBITMQ_RETRY_MAX_ATTEMPTS:3}
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        multiplier: 2.0
        max-attempts: 3

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "cl.duoc.vidasalud.bff.event"
    listener:
      missing-topics-fatal: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/v2.0
          audiences:
            - api://${AZURE_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}
            - ${AZURE_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}

azure:
  tenant-id: ${AZURE_TENANT_ID:common}
  api-client-id: ${AZURE_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    cl.duoc.vidasalud.bff: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

vidasalud:
  rabbitmq:
    exchanges:
      direct: vidasalud.direct.exchange
      topic: vidasalud.topic.exchange
      dlx: vidasalud.dlx.exchange
    queues:
      appointment-creation: citas.agendamiento.queue
      appointment-confirmation: citas.confirmacion.queue
      notification-audit: notificaciones.auditoria.queue
      appointment-creation-dlq: citas.agendamiento.dlq
      appointment-confirmation-dlq: citas.confirmacion.dlq
      notification-audit-dlq: notificaciones.auditoria.dlq
    routing-keys:
      appointment-create: citas.crear
      appointment-confirm: citas.confirmar
      notification-audit: vidasalud.notificacion.*
      notification-audit-default: vidasalud.notificacion.audit
      appointment-creation-dlq: citas.agendamiento.dlq.rk
      appointment-confirmation-dlq: citas.confirmacion.dlq.rk
      notification-audit-dlq: notificaciones.auditoria.dlq.rk

  kafka:
    enabled: ${VIDASALUD_KAFKA_ENABLED:true}
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    topics:
      atenciones-stream: vidasalud.atenciones.stream
      telemetria-stream: vidasalud.telemetria.stream
    partitions: 3
    replicas: 3
    retention-atenciones-ms: 604800000   # 7 días
    retention-telemetria-ms: 259200000   # 3 días
    cleanup-policy: delete
    consumer-groups:
      analitica-group: vidasalud-analitica-group
      alertas-group: vidasalud-alertas-group
